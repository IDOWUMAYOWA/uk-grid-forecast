[project]
name = "gridcast"
version = "0.1.0"
description = "Production-grade half-hourly electricity demand and supply-margin forecasting for Great Britain."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sangotade Idowu", email = "sangotadeidowu@yahoo.com" }]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
gridcast = "gridcast.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # naming
    "SIM",           # simplify
    "PTH",           # use pathlib
    "RUF",
    "S",             # bandit security checks
    "DTZ",           # timezone-aware datetimes (critical for settlement periods)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=gridcast --cov-report=term-missing"
markers = [
    "integration: hits real external APIs (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
branch = true
source = ["gridcast"]
